[project]
name = "hrzz-transcritor"
version = "0.1.0"
description = "Transcricao local do HRZZ (faster-whisper, yt-dlp, WASAPI loopback no Windows)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "faster-whisper>=1.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "websockets>=12",
  "numpy>=1.26",
  "av>=14,<17",
  "yt-dlp>=2024.10.22",
  "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
  # placa NVIDIA no Windows: bibliotecas CUDA 12 que o CTranslate2 usa (~1,2 GB). Sem a placa, o motor volta pro processador sozinho
  "nvidia-cublas-cu12>=12.4,<=12.8.4.1; sys_platform == 'win32'",
  "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",
]

[tool.uv]
package = false
