[project]
name = "hrzz-transcritor"
version = "0.1.0"
description = "Transcricao local do HRZZ (faster-whisper, yt-dlp, WASAPI loopback no Windows)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "faster-whisper>=1.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "websockets>=12",
  "numpy>=1.26",
  "yt-dlp>=2024.10.22",
  "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
]

[tool.uv]
package = false
